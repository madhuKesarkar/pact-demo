name: Pact Contract Tests

on:
  push:
    branches: [main]
  pull_request:

env:
  PACT_DO_NOT_TRACK: true

jobs:
  consumer:
    name: Consumer – generate contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: rm -rf pacts && npm run test:consumer
      - uses: actions/upload-artifact@v4
        with:
          name: pact-contract
          path: pacts/

  provider:
    name: Provider – verify contract
    needs: consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: pact-contract
          path: pacts/
      - run: npm run test:provider
